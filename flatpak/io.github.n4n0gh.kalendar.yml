#
# Builds Kalendar as a Flatpak:
#
#   flatpak-builder --user --install --force-clean build-flatpak flatpak/io.github.n4n0gh.kalendar.yml
#   flatpak run io.github.n4n0gh.kalendar

id: io.github.n4n0gh.kalendar
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: kalendar

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The settings of Plasma's global theme (the icon theme, say), which are not
  # in kdeglobals (that one the runtime lets be read); main.cpp has KDE's
  # libraries look here.
  - --filesystem=xdg-config/kdedefaults:ro
  # Synchronizing with the accounts' servers.
  - --share=network
  # The accounts' passwords.
  - --talk-name=org.kde.kwalletd6
  # The Google accounts of the system's Online Accounts: which there are
  # (only read), and the service that is signed in to them.
  - --filesystem=xdg-config/libaccounts-glib:ro
  - --talk-name=com.google.code.AccountsSSO.SingleSignOn
  # The calendars of the system. Akonadi is asked, on the session bus, which
  # calendar files it shows: its control knows the agents, and each agent for
  # a calendar file knows where its file is. The same way, Akonadi is told
  # to show Kalendar's own events, which are kept as a calendar file in the
  # data folder: an agent is made for that file and told where it is.
  - --talk-name=org.freedesktop.Akonadi.Control
  - --talk-name=org.freedesktop.Akonadi.Resource.*
  - --talk-name=org.freedesktop.Akonadi.Agent.*
  # Those files are then read, and those of calendars that Akonadi lets be
  # changed are written to, wherever in the home folder they are. Other
  # Flatpaks keep theirs in their data folders, which the home folder alone
  # leaves out; those are only read.
  - --filesystem=home
  - --filesystem=~/.var/app:ro
  # (The home folder also covers clearing away the plugin for the calendar of
  # Plasma's clock that earlier versions installed, below ~/.local/lib and
  # in the folder of scripts that Plasma runs at login.)

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /mkspecs
  - /share/doc
  - '*.a'

modules:
  # Everything Kalendar builds on is part of the KDE runtime.
  - name: kalendar
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - build-flatpak
          - repo
          - site

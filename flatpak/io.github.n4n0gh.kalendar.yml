#
# Builds Kalendar as a Flatpak:
#
#   flatpak-builder --user --install --force-clean build-flatpak flatpak/io.github.n4n0gh.kalendar.yml
#   flatpak run io.github.n4n0gh.kalendar

id: io.github.n4n0gh.kalendar
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: kalendar

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The settings of Plasma's global theme (the icon theme, say), which are not
  # in kdeglobals (that one the runtime lets be read); main.cpp has KDE's
  # libraries look here.
  - --filesystem=xdg-config/kdedefaults:ro
  # Synchronizing with the accounts' servers.
  - --share=network
  # The accounts' passwords.
  - --talk-name=org.kde.kwalletd6
  # The Google accounts of the system's Online Accounts: which there are
  # (only read), and the service that is signed in to them.
  - --filesystem=xdg-config/libaccounts-glib:ro
  - --talk-name=com.google.code.AccountsSSO.SingleSignOn
  # Installing the plugin for the calendar of Plasma's clock, from the
  # settings: a copy of the plugin, and the line that tells Plasma at login
  # where to look for it.
  - --filesystem=~/.local/lib/kalendar:create
  - --filesystem=xdg-config/plasma-workspace/env:create

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /mkspecs
  - /share/doc
  - '*.a'

modules:
  # Everything Kalendar builds on is part of the KDE runtime.
  - name: kalendar
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - build-flatpak
          - repo
          - site
